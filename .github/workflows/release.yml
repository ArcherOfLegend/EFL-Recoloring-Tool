name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish EflRecolor.csproj -c Release -o publish

      - name: Zip
        run: Compress-Archive -Path publish/EflRecolor.exe -DestinationPath EflRecolor-${{ github.ref_name }}.zip

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: EflRecolor-${{ github.ref_name }}.zip
          draft: true
          generate_release_notes: true
